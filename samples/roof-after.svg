<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-label="">
  <defs>
    <linearGradient id="sky-a" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#24414d"/>
      <stop offset="1" stop-color="#6d8b94"/>
    </linearGradient>
    <linearGradient id="memb-a" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#949ea4"/>
      <stop offset="1" stop-color="#727c83"/>
    </linearGradient>
    <linearGradient id="copper-a" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7e4a26"/>
      <stop offset="0.45" stop-color="#c48a55"/>
      <stop offset="0.55" stop-color="#e2b083"/>
      <stop offset="0.7" stop-color="#b06f3c"/>
      <stop offset="1" stop-color="#8a5329"/>
    </linearGradient>
    <radialGradient id="glow-a" cx="0.8" cy="0.18" r="0.6">
      <stop offset="0" stop-color="#cfe0e3" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#cfe0e3" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- sky -->
  <rect width="1200" height="560" fill="url(#sky-a)"/>
  <rect width="1200" height="560" fill="url(#glow-a)"/>

  <!-- distant Montréal skyline + Mount Royal -->
  <path d="M0 560V486c120-10 150-58 250-62 96-4 150 40 250 40 70 0 96-18 150-18v114Z" fill="#22333b" opacity="0.55"/>
  <g fill="#1c2c33" opacity="0.7">
    <rect x="760" y="452" width="42" height="108"/>
    <rect x="812" y="430" width="30" height="130"/>
    <rect x="852" y="470" width="54" height="90"/>
    <rect x="918" y="442" width="34" height="118"/>
    <rect x="962" y="486" width="60" height="74"/>
    <rect x="1034" y="458" width="40" height="102"/>
    <rect x="1086" y="476" width="48" height="84"/>
  </g>

  <!-- roof membrane (looking across a flat roof) -->
  <path d="M205 560H1000L1180 868H20Z" fill="url(#memb-a)"/>
  <!-- membrane seams in perspective -->
  <g stroke="#20272c" stroke-opacity="0.10" stroke-width="3">
    <path d="M330 560 233 868"/>
    <path d="M470 560 447 868"/>
    <path d="M610 560 660 868"/>
    <path d="M750 560 874 868"/>
    <path d="M880 560 1080 868"/>
    <path d="M150 700H1085" stroke-opacity="0.07"/>
  </g>

  <!-- parapet + copper coping along the back edge -->
  <rect x="205" y="540" width="795" height="22" fill="#4a535a"/>
  <rect x="205" y="529" width="795" height="13" rx="3" fill="url(#copper-a)"/>
  <rect x="205" y="529" width="795" height="4" rx="2" fill="#f3d8b8" opacity="0.55"/>

  <!-- roof drain, clear -->
  <g>
    <ellipse cx="600" cy="726" rx="78" ry="34" fill="#39424a"/>
    <ellipse cx="600" cy="720" rx="60" ry="26" fill="#262d33"/>
    <g stroke="#454f57" stroke-width="3" stroke-linecap="round">
      <path d="M558 720h84M566 710h68M566 730h68"/>
      <path d="M600 700v40"/>
    </g>
  </g>

  <!-- clean gleam on membrane -->
  <path d="M205 560H1000l-150 60H300Z" fill="#ffffff" opacity="0.06"/>
  <!-- subtle vignette -->
  <rect width="1200" height="900" fill="#0e1417" opacity="0.05"/>
</svg>
