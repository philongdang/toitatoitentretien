<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" role="img" aria-label="Toit à Toit Entretien">
  <!--
    Recreation of the Toit à Toit Entretien mark (roof + sweeping broom + autumn
    leaves) in the brand colours. Swap with the official asset when available.
    Colours are hardcoded because an <img>-referenced SVG can't read page CSS vars.
  -->
  <defs>
    <g id="lf">
      <path d="M0 0c1.7-4.4 7.8-5.6 11-3.7C10.3 0.9 5 3.6 0 0Z"/>
      <path d="M1.8 -0.7 8.8 -4.3" stroke="#6b4e1c" stroke-opacity="0.45" stroke-width="0.9" fill="none"/>
    </g>
  </defs>

  <!-- roof -->
  <path d="M9 41 32 17.5 55 41" stroke="#e9531d" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- ridge accent -->
  <path d="M20.5 31.5 32 20.5 43.5 31.5" stroke="#c13f16" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.5"/>

  <!-- broom: charcoal handle + amber bristles -->
  <path d="M30 27.5 38.6 45" stroke="#2b2622" stroke-width="2.6" stroke-linecap="round"/>
  <g stroke="#c9882f" stroke-width="2" stroke-linecap="round">
    <path d="M38.6 45 34.8 49.2"/>
    <path d="M38.6 45 37.4 50"/>
    <path d="M38.6 45 40.2 49.3"/>
    <path d="M38.6 45 42 47.6"/>
  </g>

  <!-- falling autumn leaves -->
  <use href="#lf" transform="translate(45 14.5) rotate(20) scale(1)" fill="#f2a12b"/>
  <use href="#lf" transform="translate(53.5 20.5) rotate(-26) scale(0.95)" fill="#f4c430"/>
  <use href="#lf" transform="translate(47.5 27.5) rotate(48) scale(0.9)" fill="#6e9a3a"/>
</svg>
