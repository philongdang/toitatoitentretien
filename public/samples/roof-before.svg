<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-label="">
  <defs>
    <linearGradient id="sky-b" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3c444a"/>
      <stop offset="1" stop-color="#7d878c"/>
    </linearGradient>
    <linearGradient id="memb-b" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7c8488"/>
      <stop offset="1" stop-color="#5b6266"/>
    </linearGradient>
    <linearGradient id="copper-b" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#62462f"/>
      <stop offset="0.5" stop-color="#8d6f50"/>
      <stop offset="1" stop-color="#62462f"/>
    </linearGradient>
    <radialGradient id="pool-b" cx="0.5" cy="0.45" r="0.6">
      <stop offset="0" stop-color="#1b282f"/>
      <stop offset="1" stop-color="#2c3a42"/>
    </radialGradient>
    <g id="leaf-b">
      <path d="M0 0c2-7 12-11 19.5-9C18.5 -1.5 10 5 0 0Z"/>
      <path d="M2.5 -0.8 15.5 -6.5" fill="none" stroke="#33260f" stroke-opacity="0.4" stroke-width="1.2"/>
    </g>
  </defs>

  <!-- overcast sky -->
  <rect width="1200" height="560" fill="url(#sky-b)"/>

  <!-- skyline -->
  <path d="M0 560V486c120-10 150-58 250-62 96-4 150 40 250 40 70 0 96-18 150-18v114Z" fill="#28353c" opacity="0.5"/>
  <g fill="#212f36" opacity="0.6">
    <rect x="760" y="452" width="42" height="108"/>
    <rect x="812" y="430" width="30" height="130"/>
    <rect x="852" y="470" width="54" height="90"/>
    <rect x="918" y="442" width="34" height="118"/>
    <rect x="962" y="486" width="60" height="74"/>
    <rect x="1034" y="458" width="40" height="102"/>
    <rect x="1086" y="476" width="48" height="84"/>
  </g>

  <!-- roof membrane (dirtier) -->
  <path d="M205 560H1000L1180 868H20Z" fill="url(#memb-b)"/>
  <g stroke="#1b2227" stroke-opacity="0.12" stroke-width="3">
    <path d="M330 560 233 868"/>
    <path d="M470 560 447 868"/>
    <path d="M610 560 660 868"/>
    <path d="M750 560 874 868"/>
    <path d="M880 560 1080 868"/>
  </g>
  <!-- dark stains / moss patches -->
  <g fill="#2c3128" opacity="0.32">
    <path d="M250 640c40-8 70 4 64 22-6 16-58 18-78 6-16-10-6-22 14-28Z"/>
    <path d="M820 600c30-6 52 2 50 16-2 14-44 18-62 8-14-8-4-18 12-24Z"/>
    <path d="M150 820c50-10 96 0 92 18-4 16-70 22-100 10-22-9-12-22 8-28Z"/>
  </g>
  <g fill="#3a2f1d" opacity="0.22">
    <ellipse cx="940" cy="800" rx="120" ry="34"/>
    <ellipse cx="430" cy="720" rx="80" ry="22"/>
  </g>

  <!-- parapet + dulled copper coping -->
  <rect x="205" y="540" width="795" height="22" fill="#3f484f"/>
  <rect x="205" y="529" width="795" height="13" rx="3" fill="url(#copper-b)"/>

  <!-- large pooled water around the clogged drain -->
  <ellipse cx="600" cy="734" rx="196" ry="74" fill="url(#pool-b)" opacity="0.62"/>
  <ellipse cx="600" cy="726" rx="150" ry="54" fill="#23323a" opacity="0.5"/>
  <path d="M486 712c66-18 198-18 250 4" fill="none" stroke="#dfe7e9" stroke-opacity="0.22" stroke-width="3"/>
  <path d="M520 752c50-10 120-10 168 2" fill="none" stroke="#0e1417" stroke-opacity="0.25" stroke-width="4"/>

  <!-- drain, mostly buried -->
  <ellipse cx="600" cy="728" rx="60" ry="26" fill="#323b42"/>
  <ellipse cx="600" cy="724" rx="44" ry="18" fill="#242b31"/>

  <!-- dense autumn leaf cover -->
  <g>
    <use href="#leaf-b" transform="translate(300 600) rotate(18) scale(1.9)" fill="#b5703c"/>
    <use href="#leaf-b" transform="translate(400 632) rotate(-32) scale(2.2)" fill="#8c7a32"/>
    <use href="#leaf-b" transform="translate(250 668) rotate(60) scale(2)" fill="#9a5a2e"/>
    <use href="#leaf-b" transform="translate(720 596) rotate(-14) scale(1.7)" fill="#c2924c"/>
    <use href="#leaf-b" transform="translate(840 628) rotate(40) scale(2.3)" fill="#a8632f"/>
    <use href="#leaf-b" transform="translate(930 690) rotate(-50) scale(2.5)" fill="#8c7a32"/>
    <use href="#leaf-b" transform="translate(210 740) rotate(22) scale(2.6)" fill="#b5703c"/>
    <use href="#leaf-b" transform="translate(360 780) rotate(-70) scale(2.5)" fill="#9a5a2e"/>
    <use href="#leaf-b" transform="translate(150 690) rotate(48) scale(2.2)" fill="#8c7a32"/>
    <use href="#leaf-b" transform="translate(470 600) rotate(-22) scale(1.8)" fill="#a8632f"/>
    <use href="#leaf-b" transform="translate(560 612) rotate(80) scale(1.9)" fill="#c2924c"/>
    <use href="#leaf-b" transform="translate(770 760) rotate(10) scale(2.7)" fill="#b5703c"/>
    <use href="#leaf-b" transform="translate(900 800) rotate(-30) scale(2.8)" fill="#9a5a2e"/>
    <use href="#leaf-b" transform="translate(1000 740) rotate(36) scale(2.5)" fill="#a8632f"/>
    <use href="#leaf-b" transform="translate(300 840) rotate(-12) scale(2.7)" fill="#8c7a32"/>
    <use href="#leaf-b" transform="translate(630 820) rotate(54) scale(2.6)" fill="#c2924c"/>
    <use href="#leaf-b" transform="translate(1060 820) rotate(-44) scale(2.6)" fill="#b5703c"/>
  </g>

  <!-- thick leaf pile choking the drain -->
  <g>
    <use href="#leaf-b" transform="translate(520 700) rotate(-8) scale(3)" fill="#9a5a2e"/>
    <use href="#leaf-b" transform="translate(545 728) rotate(36) scale(3.2)" fill="#b5703c"/>
    <use href="#leaf-b" transform="translate(600 706) rotate(-46) scale(3.1)" fill="#7f5022"/>
    <use href="#leaf-b" transform="translate(636 730) rotate(14) scale(3)" fill="#a8632f"/>
    <use href="#leaf-b" transform="translate(590 742) rotate(70) scale(2.9)" fill="#c2924c"/>
    <use href="#leaf-b" transform="translate(560 686) rotate(120) scale(2.6)" fill="#8c7a32"/>
    <use href="#leaf-b" transform="translate(640 700) rotate(-100) scale(2.7)" fill="#9a5a2e"/>
    <path d="M548 698c10 8 48 8 66-2" fill="none" stroke="#4a3115" stroke-width="3.5" stroke-linecap="round"/>
  </g>

  <!-- heavy overcast wash + vignette -->
  <rect width="1200" height="900" fill="#3f4d55" opacity="0.24"/>
  <rect width="1200" height="900" fill="#0c1115" opacity="0.1"/>
</svg>
